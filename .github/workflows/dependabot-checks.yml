name: Dependabot Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dependabot-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:strict

      - name: Unit tests
        run: npm test

      - name: Dependency boundaries
        run: npm run quality:deps

      - name: Format check
        run: npm run format:check

      - name: Cycle check
        run: npm run quality:cycles

      - name: Unused code check
        run: npm run quality:unused

  e2e:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run playwright:install

      - name: E2E tests
        run: npm run test:e2e