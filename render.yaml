services:
  - type: web
    name: capsule-wardrobe
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: PASSKEY_RP_ID
        sync: false
      - key: PASSKEY_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_CODE_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
  - type: cron
    name: capsule-wardrobe-cleanup
    runtime: node
    schedule: "0 3 * * *"
    buildCommand: npm ci --include=dev && npm --workspace server run build
    startCommand: npm run prune:expired-records
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
