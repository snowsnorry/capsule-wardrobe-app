services:
  - type: web
    name: capsule-wardrobe
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: PASSKEY_RP_ID
        sync: false
      - key: PASSKEY_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: AUTH_CODE_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
