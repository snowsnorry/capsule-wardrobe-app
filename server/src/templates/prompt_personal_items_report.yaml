      IMPORTANT OUTPUT CONSTRAINTS

      - All text values must be in English.
      - Do not include schemaVersion in the output. The application code will add it after parsing.
      - Use only exact item IDs provided in PERSONAL ITEMS.
      - Never invent item IDs.
      - Never invent unavailable replacement product IDs.
      - Never generate new outfit sets.
      - Return [] for empty arrays.
      - Return null only where the schema explicitly allows null.
      - Scores must be numbers from 0 to 1.
      - categoryCounts must sum to personalItemsOverview.itemCount.
      - estimatedOutfitRange.min must be less than or equal to estimatedOutfitRange.max when both are numbers.
      - temperatureBandC.min must be less than or equal to temperatureBandC.max when both are numbers.
      - Use unknown only where explicitly allowed.
      - Use personalItems item IDs only in machine-readable ID fields.
      - Never expose raw item IDs in user-facing text fields.
      - Prefer concise text suitable for UI display.
      - The output must exactly match the provided structured output schema.
  - role: user
    content: |
      Analyze the provided personalItems and generate a personalItems report.

      PERSONAL ITEMS:
      {{items}}

      PERSONAL ITEMS CONTEXT:
      {{context}}

      The attached image, if provided, is a visual collage of the same personalItems listed above.

      INPUT NOTES:
      - Each personalItems item has an exact "id" value unless the input data is malformed.
      - The text metadata is the source of truth for item IDs and declared item attributes.
      - Use the attached collage image, if provided, to refine the visual assessment of color, silhouette, texture, proportion, contrast, material weight, style clusters, and practical compatibility.
      - If PERSONAL ITEMS CONTEXT is empty or missing, do not invent user lifestyle requirements. Reflect missing lifestyle context in confidence only when it materially affects the report.
      - If the input appears to be a category-specific subset rather than a general personalItems set, reflect that assumption in confidence.assumptions.

      OUTPUT:
      Return strictly valid JSON matching the personalItems report schema from the system instructions and the OpenAI request response_format if supplied.
