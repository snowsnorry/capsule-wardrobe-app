            },
            "styleFit": {
                "score": "Number from 0 to 1. Target style alignment score.",
                "primaryDetectedStyle": "Main detected capsule style. Allowed values: minimalistic, street_style, romantic, preppy, retro, boho, nautical, safari, equestrian, military, grunge, sporty, mixed, unclear.",
                "secondaryDetectedStyles": [
                    "Secondary detected capsule styles if relevant. Allowed values: minimalistic, street_style, romantic, preppy, retro, boho, nautical, safari, equestrian, military, grunge, sporty, mixed, unclear."
                ],
                "targetMatched": "Boolean. True if the detected capsule style matches the requested target style.",
                "notes": "Concise English explanation of style fit."
            },
            "accentColorFit": {
                "score": "Number from 0 to 1. Target accent color alignment score.",
                "targetAccentColor": "Requested accent color, or null if no accent color was provided.",
