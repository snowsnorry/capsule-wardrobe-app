            "colorScore": "Number from 0 to 1. Capsule color coherence score.",
            "notes": "Concise English explanation of the capsule palette."
        },
        "generatedOutfitAssessment": {
            "providedOutfitCount": "Number of generated outfit sets provided in the input.",
            "overallScore": "Number from 0 to 1. Overall quality of the provided generated outfit sets as proof that the capsule works.",
            "completeOutfitCount": "Number of generated outfit sets that are complete wearable outfits.",
            "weakOutfitCount": "Number of generated outfit sets with meaningful issues.",
            "varietyScore": "Number from 0 to 1. Variety across the provided generated outfit sets.",
            "targetFitScore": "Number from 0 to 1. How well the generated outfit sets fit the requested capsule parameters.",
            "roleCoverageScore": "Number from 0 to 1. How well the generated outfit sets cover required outfit roles.",
            "repetitionScore": "Number from 0 to 1. How well the generated outfit sets avoid excessive repetition.",
            "strongestOutfitRefs": [
                "IDs of the strongest provided generated outfit sets. Use generated outfit IDs, not item IDs. Return [] if none stand out."
            ],
            "weakOutfits": [
