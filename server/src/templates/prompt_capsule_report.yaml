      IMPORTANT OUTPUT CONSTRAINTS

      * All text values must be in English.
      * Do not include schemaVersion in the output. The application code will add it after parsing.
      * Use only exact item IDs provided in CAPSULE ITEMS.
      * Never invent item IDs.
      * Never invent unavailable replacement product IDs.
      * Never generate new outfit sets.
      * Return [] for empty arrays.
      * Return null only where the schema explicitly allows null.
      * Scores must be numbers from 0 to 1.
      * categoryCounts must sum to itemCount.
      * secondarySeasons must not repeat primarySeasons.
      * temperatureBandC.min must be less than or equal to temperatureBandC.max when both are not null.
      * Use generated outfit IDs only in generatedOutfitAssessment.strongestOutfitRefs and generatedOutfitAssessment.weakOutfits.outfitId.
      * Use capsule item IDs only in affectedItemIds, targetItemIds, and generatedOutfitAssessment.weakOutfits.affectedItemIds.
      * Prefer concise text suitable for UI display.
      * The output must exactly match the provided structured output schema.

  - role: user
    content: |
      Analyze the provided capsule wardrobe and generate a capsule report.

      CAPSULE PARAMETERS:
      Audience: {{audience}}
      Occasions: {{occasions}}
      Seasons: {{season}}
      Target Formality: {{formality_level}}
      Target Style: {{style}}
      Accent Color: {{color}}
      Pattern: {{pattern}}
      {{additional_info_block}}

      CAPSULE ITEMS:
      {{items}}

      GENERATED OUTFIT SETS:
      {{generated_outfits}}

      The generated outfit sets are existing combinations created for this capsule.
      Each generated outfit set contains item IDs from CAPSULE ITEMS.
      Evaluate these outfit sets, but do not create new outfit sets.

      The attached image, if provided, is a visual collage of the same capsule items listed above.

      INPUT NOTES:
      - Each capsule item has an exact "id" value.
      - The text metadata is the source of truth for item IDs and declared item attributes.
      - Use the attached collage image to refine the visual assessment of color, silhouette, texture, proportion, contrast, material weight, and styling coherence.
      - Use GENERATED OUTFIT SETS only as existing outfit combinations to audit.

      OUTPUT:
      Return strictly valid JSON matching the capsule report schema supplied in the OpenAI request response_format.
