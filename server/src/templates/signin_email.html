<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Capsule Wardrobe sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background:#f7f4ef;font-family:'DM Sans','Helvetica',Arial,sans-serif;color:#1f2933;">
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background:#f7f4ef;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:560px;background:#ffffff;border:1px solid rgba(20,60,60,0.12);border-radius:18px;overflow:hidden;">
            <tr>
              <td style="padding:24px 28px 8px 28px;">
                <div style="display:inline-block;padding:6px 10px;background:rgba(28,124,124,0.1);color:#1c7c7c;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;">
                  Capsule Wardrobe
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:6px 28px 0 28px;">
                <h1 style="margin:0;font-size:28px;line-height:1.2;color:#1f2933;font-weight:700;">
                  Sign in with this code
                </h1>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 28px 0 28px;">
                <p style="margin:0;font-size:16px;line-height:1.6;color:#52606d;">
                  Enter this verification code in the app to continue.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 28px 0 28px;">
                <div style="background:#f7f4ef;border:1px dashed rgba(28,124,124,0.35);border-radius:14px;padding:18px;text-align:center;">
                  <span style="display:block;font-size:34px;line-height:1;font-weight:700;letter-spacing:0.2em;color:#1c7c7c;">
                    {{CODE}}
                  </span>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px 0 28px;">
                <p style="margin:0;font-size:14px;line-height:1.6;color:#52606d;">
                  This code expires in <strong style="color:#1f2933;">{{EXPIRES_IN_MINUTES}} minute(s)</strong>.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 28px 28px 28px;">
                <p style="margin:0;font-size:13px;line-height:1.6;color:#7b8794;">
                  Didn't request this email? You can safely ignore it.
                </p>
              </td>
            </tr>
            <tr>
              <td style="height:6px;background:#f0b429;font-size:0;line-height:0;">&nbsp;</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
