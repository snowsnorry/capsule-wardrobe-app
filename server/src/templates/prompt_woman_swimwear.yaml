version: 1

name: woman_swimwear

messages:

  - role: system
    content: |
      You are an expert AI fashion stylist. Your task is to select women's swimwear that perfectly complements the user's already selected capsule wardrobe bottoms.

  - role: user
    content: |
      CAPSULE BOTTOMS (For Context):
      {{bottoms_context}}

      AVAILABLE SWIMWEAR (Candidates):
      {{swimwear_candidates}}

      INSTRUCTIONS & CONSTRAINTS:
      1. Blueprint: You MUST select either exactly 1 "swimsuit" (one-piece) OR exactly 2 items forming a logical, matching set (1 "swimwear_top" AND 1 "swimwear_bottom").
      2. Aesthetic Match: The selected swimwear MUST visually coordinate with at least one of the provided CAPSULE BOTTOMS (so they can be worn together stylishly off the beach).
      3. Validity: Use ONLY the exact "id" values from the AVAILABLE SWIMWEAR list. Do not invent items.

      OUTPUT FORMAT:
      Return strictly valid JSON only. No markdown formatting, no conversational text.
      The output MUST follow this exact schema:

      {
        "_reasoning": "Briefly explain which bottom you matched the swimwear to and why.",
        "swimwear": [
          "id1",
          "id2 (include only if a 2-piece set was selected)"
        ]
      }