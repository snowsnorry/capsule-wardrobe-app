[build]
  command = "VITE_DISABLE_PWA=true npm --workspace client run build"
  publish = "client/dist"

[functions]
  directory = "client/netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/bff/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
